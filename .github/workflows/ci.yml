name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check version file
        run: |
          set -euo pipefail
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' VERSION

      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck --source-path=hooks install.sh uninstall.sh hooks/*.sh

  build-release:
    if: needs.prepare-release.outputs.should_release == 'true'
    needs: [test, prepare-release]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.version=${{ needs.prepare-release.outputs.tag }}" \
            -o "ai-attn-${GOOS}-${GOARCH}" \
            ./cmd/ai-attn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-attn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ai-attn-${{ matrix.goos }}-${{ matrix.goarch }}

  prepare-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected_tag="${{ steps.version.outputs.tag }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)" >&2
            exit 1
          fi

      - name: Create version tag
        id: release
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          if [ "$GITHUB_REF" = "refs/tags/$tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    if: needs.prepare-release.outputs.should_release == 'true'
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name 'ai-attn-*' -exec cp {} ../ \;
          cd ..
          sha256sum ai-attn-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            ai-attn-*
            checksums.txt
